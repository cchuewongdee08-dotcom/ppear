<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P.Pear ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: black;
    overflow: hidden;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

const words = ["love you", "Love You", "LOVE YOU"];

const colors = [
    "#4682B4",
    "#1E90FF",
    "#00BFFF",
    "#6495ED",
    "#4169E1"
];

let particles = [];

function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t));

    return { x, y };
}

for (let i = 0; i < 230; i++) {

    const t = Math.random() * Math.PI * 2;
    const r = 0.1 + Math.random() * 0.85;

    const h = heart(t);

    particles.push({
        x: h.x * r,
        y: h.y * r,
        text: words[Math.floor(Math.random() * words.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 12 + Math.random() * 8,
        alpha: 0,
        delay: Math.random() * 180,
        flicker: Math.random() * Math.PI * 2
    });
}

let frame = 0;

function draw() {

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    frame++;

    const scale = Math.min(canvas.width, canvas.height) / 40;

    particles.forEach(p => {

        if (frame > p.delay && p.alpha < 1) {
            p.alpha += 0.025;
        }

        if (p.alpha <= 0) return;

        const flicker =
            0.75 +
            0.25 * Math.sin(frame * 0.04 + p.flicker);

        const alpha = p.alpha * flicker;

        const x = canvas.width / 2 + p.x * scale;
        const y = canvas.height / 2 + p.y * scale;

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";

        ctx.shadowBlur = 15;
        ctx.shadowColor = p.color;

        ctx.fillStyle = p.color;

        ctx.fillText(p.text, x, y);

        ctx.restore();
    });

    // P.Pear ตรงกลาง
    ctx.save();

    ctx.font = "bold 54px Georgia";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.shadowBlur = 20;
    ctx.shadowColor = "white";

    ctx.fillStyle = "white";

    ctx.fillText(
        "P.Pear",
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.restore();

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
